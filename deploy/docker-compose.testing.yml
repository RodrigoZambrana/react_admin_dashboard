version: "3.9"

x-backend-common: &backend-common
  restart: unless-stopped
  env_file:
    - ./env/backend.testing.env
  environment:
    NODE_ENV: production
    PORT: 3000
    PRISMA_APPLY_MIGRATIONS: ${PRISMA_APPLY_MIGRATIONS:-false}

x-frontend-common: &frontend-common
  restart: unless-stopped
  env_file:
    - ./env/frontend.testing.env

services:
  frontend:
    <<: *frontend-common
    image: ${FRONTEND_IMAGE:-ghcr.io/ORG/REPO-frontend:${IMAGE_TAG:-latest}}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    environment:
      SERVER_NAME: ${APP_DOMAIN_TESTING:-localhost}
      BACKEND_HOST: backend
      BACKEND_PORT: 3000

  backend:
    <<: *backend-common
    image: ${BACKEND_IMAGE:-ghcr.io/ORG/REPO-backend:${IMAGE_TAG:-latest}}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - managed-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
    volumes:
      - postgres_data_testing:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_testing:
