version: "3.9"

x-backend-common: &backend-common
  restart: unless-stopped
  env_file:
    - ./env/backend.testing.env
  environment:
    NODE_ENV: production
    PORT: 3000
    PRISMA_APPLY_MIGRATIONS: ${PRISMA_APPLY_MIGRATIONS:-false}

x-frontend-common: &frontend-common
  restart: unless-stopped
  env_file:
    - ./env/frontend.testing.env

x-storefront-common: &storefront-common
  restart: unless-stopped
  env_file:
    - ./env/storefront.testing.env
  environment:
    NODE_ENV: production
    PORT: 3000

services:
  frontend:
    <<: *frontend-common
    image: ${FRONTEND_IMAGE:-ghcr.io/ORG/REPO-frontend:${IMAGE_TAG:-latest}}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      # Exporta VITE_CLIENT_SLUG antes del build para elegir una variante específica (e.g. urucortinas)
      args:
        VITE_CLIENT_SLUG: ${VITE_CLIENT_SLUG:-core}
    ports:
      - "80:80"
    environment:
      SERVER_NAME: ${APP_DOMAIN_TESTING:-localhost}
      BACKEND_HOST: backend
      BACKEND_PORT: 3000

  backend:
    <<: *backend-common
    image: ${BACKEND_IMAGE:-ghcr.io/ORG/REPO-backend:${IMAGE_TAG:-latest}}
    build:
      context: ../backend
      dockerfile: Dockerfile
      # Exporta CLIENT_SLUG para seleccionar una configuración específica de cliente (e.g. urucortinas)
      args:
        CLIENT_SLUG: ${CLIENT_SLUG:-core}
    ports:
      - "3000:3000"

  storefront:
    <<: *storefront-common
    image: ${STOREFRONT_IMAGE:-ghcr.io/ORG/REPO-storefront:${IMAGE_TAG:-latest}}
    build:
      context: ..
      dockerfile: ecommerce/Dockerfile
      target: runtime
    ports:
      - "${STOREFRONT_HTTP_PORT:-3001}:3000"
    depends_on:
      - backend
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE_STOREFRONT:-false}"
      - "traefik.http.routers.storefront.rule=Host(`${TRAEFIK_STOREFRONT_HOST:-storefront.local}`)"
      - "traefik.http.routers.storefront.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.services.storefront.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - managed-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
    volumes:
      - postgres_data_testing:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_testing:
