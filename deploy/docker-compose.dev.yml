name: admin-dashboard-dev

x-backend-common: &backend-common
  env_file:
    - path: ./env/backend.dev.env
    - path: ./env/.env.backend.dev.local
      required: false
  environment:
    PORT: ${BACKEND_PORT:-4000}

x-frontend-common: &frontend-common
  env_file:
    - ./env/frontend.dev.env

x-storefront-common: &storefront-common
  env_file:
    - ../ecommerce/.env
    - ./env/storefront.dev.env
  environment:
    PORT: ${STOREFRONT_PORT:-3000}

services:
  backend:
    <<: *backend-common
    container_name: dashboard-backend-dev
    build:
      context: ../backend
      dockerfile: Dockerfile
      # Ajusta CLIENT_SLUG para ejecutar una variante específica (por ejemplo urucortinas)
      args:
        CLIENT_SLUG: ${CLIENT_SLUG:-core}
      target: runtime
    working_dir: /app
    command: >
      sh -c '
        set -e;
        export PGPASSWORD="${DB_PASSWORD:-postgres}";
        pg_host="${DB_HOST:-host.docker.internal}";
        pg_port="${DB_PORT:-5432}";
        pg_user="${DB_USER:-postgres}";
        until pg_isready -h "$$pg_host" -p "$$pg_port" -U "$$pg_user"; do
          echo "Waiting for PostgreSQL at $$pg_host:$$pg_port...";
          sleep 2;
        done;
        if [ "${SKIP_PRISMA_MIGRATIONS:-false}" != "true" ]; then
          echo "Running Prisma migrations...";
          npx prisma migrate deploy;
        else
          echo "Skipping Prisma migrations (SKIP_PRISMA_MIGRATIONS=true).";
        fi;
        if [ "${RUN_PRISMA_SEED_ON_BOOT:-false}" = "true" ]; then
          echo "Running Prisma seed...";
          npx prisma db seed;
        else
          echo "Skipping Prisma seed (RUN_PRISMA_SEED_ON_BOOT!=true).";
        fi;
        node dist/src/main.js;
      '
    ports:
      - "4000:4000"
      - "5555:5555"
    depends_on: []

  frontend:
    <<: *frontend-common
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      # Ajusta VITE_CLIENT_SLUG para construir una variante específica (por ejemplo urucortinas)
      args:
        VITE_APP_NAME: "React Admin Dashboard (Dev)"
        VITE_API_URL: "http://localhost:4000/api"
        VITE_CLIENT_SLUG: ${VITE_CLIENT_SLUG:-core}
        VITE_STATE_SIGNATURE_KEY: ${VITE_STATE_SIGNATURE_KEY:-local-dev-state-signature-change-me}
        VITE_RECAPTCHA_ENABLED: "false"
        VITE_RECAPTCHA_SITE_KEY: ""
        VITE_PARAMETRIC_IMPORT_TIMEOUT_MS: "120000"
      target: runtime
    container_name: dashboard-frontend-dev
    environment:
      SERVER_NAME: ${APP_DOMAIN_DEV:-localhost}
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT:-4000}
    ports:
      - "8080:80"
    depends_on:
      - backend

  storefront:
    <<: *storefront-common
    build:
      context: ..
      dockerfile: ecommerce/Dockerfile
      args:
        CLIENT_SLUG: core
        NEXT_PUBLIC_CLIENT_SLUG: core
        NEXT_PUBLIC_STOREFRONT_API_URL: http://localhost:4000/api/storefront
        STOREFRONT_API_URL: http://backend:4000/api/storefront
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_STOREFRONT_HOME_PATH: /
        NEXT_PUBLIC_GOOGLE_BUTTON_ENABLED: "true"
        NEXT_PUBLIC_ENABLE_STOREFRONT_MOCKS: "false"
        ENABLE_STOREFRONT_MOCKS: "false"
        NEXT_PUBLIC_ENABLE_STOREFRONT_FALLBACKS: "false"
        ENABLE_STOREFRONT_FALLBACKS: "false"
        NEXT_PUBLIC_ENABLE_SNAPSHOT_FALLBACKS: "false"
        NEXT_PUBLIC_STOREFRONT_FAIL_FAST: "false"
        STOREFRONT_FAIL_FAST: "false"
        NEXT_PUBLIC_STORE_LOCALE: es-UY
        NEXT_PUBLIC_MP_PUBLIC_KEY: ""
        NEXT_PUBLIC_MP_COUNTRY: UY
        NEXT_PUBLIC_MP_SUCCESS_URL: /payment/success
        NEXT_PUBLIC_MP_FAILURE_URL: /payment/error
        SNAPSHOT_ACCESS_TOKEN: ""
      target: runtime
    container_name: dashboard-storefront-dev
    ports:
      - "${STOREFRONT_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
