name: admin-dashboard-dev

x-backend-common: &backend-common
  env_file:
    - ./env/backend.dev.env
  environment:
    PORT: ${BACKEND_PORT:-4000}
    DB_HOST: db
    DB_PORT: 5432
    DB_USER: postgres
    DB_PASSWORD: postgres
    DB_NAME: ${POSTGRES_DB_NAME:-react_admin_dashboard}

x-frontend-common: &frontend-common
  env_file:
    - ./env/frontend.dev.env

services:
  db:
    image: postgres:16-alpine
    container_name: dashboard-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${POSTGRES_DB_NAME:-react_admin_dashboard}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  backend:
    <<: *backend-common
    container_name: dashboard-backend-dev
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    working_dir: /app
    command: >
      sh -c '
        set -e;
        export PGPASSWORD="${DB_PASSWORD:-postgres}";
        pg_host="${DB_HOST:-db}";
        pg_port="${DB_PORT:-5432}";
        pg_user="${DB_USER:-postgres}";
        until pg_isready -h "$$pg_host" -p "$$pg_port" -U "$$pg_user"; do
          echo "Waiting for PostgreSQL at $$pg_host:$$pg_port...";
          sleep 2;
        done;
        if [ "${SKIP_PRISMA_MIGRATIONS:-false}" != "true" ]; then
          echo "Running Prisma migrations...";
          npx prisma migrate deploy;
        else
          echo "Skipping Prisma migrations (SKIP_PRISMA_MIGRATIONS=true).";
        fi;
        if [ "${RUN_PRISMA_SEED_ON_BOOT:-false}" = "true" ]; then
          echo "Running Prisma seed...";
          npx prisma db seed;
        else
          echo "Skipping Prisma seed (RUN_PRISMA_SEED_ON_BOOT!=true).";
        fi;
        node dist/src/main.js;
      '
    ports:
      - "4000:4000"
      - "5555:5555"
    depends_on:
      - db

  frontend:
    <<: *frontend-common
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: dashboard-frontend-dev
    environment:
      SERVER_NAME: ${APP_DOMAIN_DEV:-localhost}
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    container_name: dashboard-proxy-dev
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data_dev:
