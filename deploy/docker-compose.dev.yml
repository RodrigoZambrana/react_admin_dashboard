name: ${APP_STACK_NAME:-admin-dashboard-dev}

x-backend-common: &backend-common
  env_file:
    - path: ./env/backend.dev.env
    - path: ./env/.env.backend.dev.local
      required: false
    - path: ../backend/.env.analytics.local
      required: false
  environment:
    CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
    PORT: ${BACKEND_PORT:-4000}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

x-frontend-common: &frontend-common
  env_file:
    - ./env/frontend.dev.env
  environment:
    VITE_CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}

x-storefront-common: &storefront-common
  env_file:
    - ./env/storefront.dev.env
  environment:
    CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
    NEXT_PUBLIC_CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
    PORT: ${STOREFRONT_PORT:-3000}
    NEXT_PUBLIC_STOREFRONT_API_URL: ${NEXT_PUBLIC_STOREFRONT_API_URL:-http://localhost:4000/api/storefront}
    STOREFRONT_API_URL: ${STOREFRONT_API_URL:-http://backend:4000/api/storefront}
    NEXT_PUBLIC_AI_PLATFORM_URL: ${NEXT_PUBLIC_AI_PLATFORM_URL:-http://localhost:4110}
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}

services:
  backend:
    <<: *backend-common
    container_name: ${APP_STACK_NAME:-admin-dashboard-dev}-backend
    build:
      context: ../backend
      dockerfile: Dockerfile
      # Ajusta CLIENT_SLUG para ejecutar una variante específica (por ejemplo urucortinas)
      args:
        CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
      target: runtime
    working_dir: /app
    environment:
      CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
      PORT: ${BACKEND_PORT:-4000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DATABASE_URL: ${DEV_DATABASE_URL:-postgresql://postgres:postgres@db:5432/react_admin_dashboard?schema=public}
      ANALYTICS_QUEUE_URL: ${ANALYTICS_QUEUE_URL:-redis://redis:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis:6379}
      DB_HOST: ${DEV_DB_HOST:-db}
      DB_PORT: ${DEV_DB_PORT:-5432}
      DB_USER: ${DEV_DB_USER:-postgres}
      DB_PASSWORD: ${DEV_DB_PASSWORD:-postgres}
      DB_NAME: ${DEV_DB_NAME:-react_admin_dashboard}
      QA_RESULTS_DIR: /qa-results
      QA_MANIFEST_PATH: /qa-tools/manifest.json
    ports:
      - "4000:4000"
      - "5555:5555"
    volumes:
      - ../.qa:/qa-results
      - ../tools/qa:/qa-tools:ro
      - ../docs:/docs:ro
      - ../backend/media:/app/media
      - ../backend/uploads:/app/uploads
    depends_on:
      - redis
    networks:
      - default
      - external_postgres

  analytics-worker:
    <<: *backend-common
    container_name: ${APP_STACK_NAME:-admin-dashboard-dev}-analytics-worker
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
      target: runtime
    working_dir: /app
    command: node dist/src/analytics/analytics.worker.js
    environment:
      CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
      NODE_ENV: production
      ANALYTICS_QUEUE_WORKER: "true"
      ANALYTICS_QUEUE_URL: ${ANALYTICS_QUEUE_URL:-redis://redis:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DEV_DATABASE_URL:-postgresql://postgres:postgres@db:5432/react_admin_dashboard?schema=public}
      DB_HOST: ${DEV_DB_HOST:-db}
      DB_PORT: ${DEV_DB_PORT:-5432}
      DB_USER: ${DEV_DB_USER:-postgres}
      DB_PASSWORD: ${DEV_DB_PASSWORD:-postgres}
      DB_NAME: ${DEV_DB_NAME:-react_admin_dashboard}
    depends_on:
      - redis
      - backend
    networks:
      - default
      - external_postgres

  analytics-health-monitor:
    <<: *backend-common
    container_name: ${APP_STACK_NAME:-admin-dashboard-dev}-analytics-health-monitor
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
      target: runtime
    working_dir: /app
    command: npm run analytics:health:monitor -- --interval-minutes ${ANALYTICS_HEALTH_INTERVAL_MINUTES:-15} --base-url ${ANALYTICS_HEALTH_BASE_URL:-http://backend:4000} --queue-name ${ANALYTICS_QUEUE_NAME:-analytics-pipeline}
    environment:
      CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
      NODE_ENV: production
      ANALYTICS_QUEUE_URL: ${ANALYTICS_QUEUE_URL:-redis://redis:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis:6379}
      ANALYTICS_HEALTH_BASE_URL: ${ANALYTICS_HEALTH_BASE_URL:-http://backend:4000}
      ANALYTICS_HEALTH_INTERVAL_MINUTES: ${ANALYTICS_HEALTH_INTERVAL_MINUTES:-15}
      ANALYTICS_HEALTH_SUMMARY_INTERVAL_MINUTES: ${ANALYTICS_HEALTH_SUMMARY_INTERVAL_MINUTES:-60}
      ANALYTICS_HEALTH_DIGEST_WINDOW_HOURS: ${ANALYTICS_HEALTH_DIGEST_WINDOW_HOURS:-24}
      ANALYTICS_HEALTH_DIGEST_LIMIT: ${ANALYTICS_HEALTH_DIGEST_LIMIT:-20}
      ANALYTICS_HEALTH_DIGEST_COOLDOWN_HOURS: ${ANALYTICS_HEALTH_DIGEST_COOLDOWN_HOURS:-24}
      ANALYTICS_HEALTH_SLACK_WEBHOOK_URL: ${ANALYTICS_HEALTH_SLACK_WEBHOOK_URL:-}
      ANALYTICS_HEALTH_ALERT_COOLDOWN_MINUTES: ${ANALYTICS_HEALTH_ALERT_COOLDOWN_MINUTES:-30}
      ANALYTICS_HEALTH_WAITING_WARNING_THRESHOLD: ${ANALYTICS_HEALTH_WAITING_WARNING_THRESHOLD:-10}
      ANALYTICS_HEALTH_WAITING_CRITICAL_THRESHOLD: ${ANALYTICS_HEALTH_WAITING_CRITICAL_THRESHOLD:-50}
      ANALYTICS_HEALTH_FAILED_CRITICAL_THRESHOLD: ${ANALYTICS_HEALTH_FAILED_CRITICAL_THRESHOLD:-5}
      ANALYTICS_HEALTH_MAX_SYNC_LAG_HOURS: ${ANALYTICS_HEALTH_MAX_SYNC_LAG_HOURS:-36}
      ANALYTICS_HEALTH_MIN_EVENT_ROWS_24H: ${ANALYTICS_HEALTH_MIN_EVENT_ROWS_24H:-1}
      ANALYTICS_HEALTH_MAX_ATTRIBUTION_MISMATCH_PCT: ${ANALYTICS_HEALTH_MAX_ATTRIBUTION_MISMATCH_PCT:-20}
      ANALYTICS_DATA_TRUST_LOOKBACK_DAYS: ${ANALYTICS_DATA_TRUST_LOOKBACK_DAYS:-7}
      ANALYTICS_DATA_TRUST_SILENCE_WINDOW_HOURS: ${ANALYTICS_DATA_TRUST_SILENCE_WINDOW_HOURS:-24}
      ANALYTICS_DATA_TRUST_MIN_CONVERSION_COUNT: ${ANALYTICS_DATA_TRUST_MIN_CONVERSION_COUNT:-1}
      ANALYTICS_DATA_TRUST_ZERO_CONVERSION_CRITICAL_TRAFFIC: ${ANALYTICS_DATA_TRUST_ZERO_CONVERSION_CRITICAL_TRAFFIC:-100}
      ANALYTICS_DATA_TRUST_ATTRIBUTION_MINIMUM_PERCENT: ${ANALYTICS_DATA_TRUST_ATTRIBUTION_MINIMUM_PERCENT:-70}
      ANALYTICS_DATA_TRUST_GA4_TOLERANCE_PERCENT: ${ANALYTICS_DATA_TRUST_GA4_TOLERANCE_PERCENT:-20}
      ANALYTICS_DATA_TRUST_TRAFFIC_DROP_THRESHOLD_PERCENT: ${ANALYTICS_DATA_TRUST_TRAFFIC_DROP_THRESHOLD_PERCENT:-40}
      DATABASE_URL: ${DEV_DATABASE_URL:-postgresql://postgres:postgres@db:5432/react_admin_dashboard?schema=public}
      DB_HOST: ${DEV_DB_HOST:-db}
      DB_PORT: ${DEV_DB_PORT:-5432}
      DB_USER: ${DEV_DB_USER:-postgres}
      DB_PASSWORD: ${DEV_DB_PASSWORD:-postgres}
      DB_NAME: ${DEV_DB_NAME:-react_admin_dashboard}
    restart: unless-stopped
    depends_on:
      - redis
      - backend
    networks:
      - default
      - external_postgres

  frontend:
    <<: *frontend-common
    container_name: ${APP_STACK_NAME:-admin-dashboard-dev}-frontend
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      # Ajusta VITE_CLIENT_SLUG para construir una variante específica (por ejemplo urucortinas)
      args:
        VITE_APP_NAME: "React Admin Dashboard (Dev)"
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
        VITE_STATE_SIGNATURE_KEY: ${VITE_STATE_SIGNATURE_KEY:-local-dev-state-signature-change-me}
        VITE_RECAPTCHA_ENABLED: "false"
        VITE_RECAPTCHA_SITE_KEY: ""
        VITE_PARAMETRIC_IMPORT_TIMEOUT_MS: "120000"
        VITE_AI_PLATFORM_URL: ${VITE_AI_PLATFORM_URL:-http://localhost:4110}
      target: runtime
    environment:
      SERVER_NAME: ${APP_DOMAIN_DEV:-localhost}
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      VITE_AI_PLATFORM_URL: ${VITE_AI_PLATFORM_URL:-http://localhost:4110}
    ports:
      - "8080:80"
    depends_on:
      - backend
      - redis

  storefront:
    <<: *storefront-common
    container_name: ${APP_STACK_NAME:-admin-dashboard-dev}-storefront
    build:
      context: ..
      dockerfile: ecommerce/Dockerfile
      target: deps
      args:
        CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
        NEXT_PUBLIC_CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
        NEXT_PUBLIC_STOREFRONT_API_URL: http://localhost:4000/api/storefront
        STOREFRONT_API_URL: http://backend:4000/api/storefront
        NEXT_PUBLIC_AI_PLATFORM_URL: ${NEXT_PUBLIC_AI_PLATFORM_URL:-http://localhost:4110}
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_STOREFRONT_HOME_PATH: /
        NEXT_PUBLIC_GOOGLE_BUTTON_ENABLED: "true"
        NEXT_PUBLIC_ENABLE_STOREFRONT_MOCKS: "false"
        ENABLE_STOREFRONT_MOCKS: "false"
        NEXT_PUBLIC_ENABLE_STOREFRONT_FALLBACKS: "false"
        ENABLE_STOREFRONT_FALLBACKS: "false"
        NEXT_PUBLIC_ENABLE_SNAPSHOT_FALLBACKS: "false"
        NEXT_PUBLIC_STOREFRONT_FAIL_FAST: "false"
        STOREFRONT_FAIL_FAST: "false"
        NEXT_PUBLIC_STORE_LOCALE: es-UY
        NEXT_PUBLIC_MP_PUBLIC_KEY: ""
        NEXT_PUBLIC_MP_COUNTRY: UY
        NEXT_PUBLIC_MP_SUCCESS_URL: /payment/success
        NEXT_PUBLIC_MP_FAILURE_URL: /payment/error
        SNAPSHOT_ACCESS_TOKEN: ""
    working_dir: /app
    command: >
      sh -c '
        if [ ! -d node_modules/next ]; then
          npm install --legacy-peer-deps;
        fi;
        npm run dev -- --hostname 0.0.0.0 --port 3000;
      '
    volumes:
      - type: bind
        source: ../ecommerce
        target: /app
      - type: bind
        source: ../src
        target: /src
      - type: bind
        source: ${STACK_RUNTIME_ROOT:-../.docker/admin-dashboard-dev}/storefront/node_modules
        target: /app/node_modules
      - type: bind
        source: ${STACK_RUNTIME_ROOT:-../.docker/admin-dashboard-dev}/storefront/.next
        target: /app/.next
    ports:
      - "${STOREFRONT_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  redis:
    image: redis:7-alpine
    container_name: ${APP_STACK_NAME:-admin-dashboard-dev}-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  default:
    name: ${APP_STACK_NAME:-admin-dashboard-dev}
  external_postgres:
    external: true
    name: ${EXTERNAL_POSTGRES_NETWORK:-postgres-local}

volumes:
  redis_data_dev:
