version: "3.9"

x-backend-common: &backend-common
  env_file:
    - ./env/backend.dev.env
  environment:
    NODE_ENV: development
    PORT: 3000

x-frontend-common: &frontend-common
  env_file:
    - ./env/frontend.dev.env

services:
  db:
    image: postgres:16-alpine
    container_name: dashboard-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashboard
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    <<: *backend-common
    image: node:20-alpine
    container_name: dashboard-backend-dev
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "3000:3000"
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - db

  frontend:
    <<: *frontend-common
    image: node:20-alpine
    container_name: dashboard-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    environment:
      SERVER_NAME: ${APP_DOMAIN_DEV:-localhost}
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    container_name: dashboard-proxy-dev
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules:
