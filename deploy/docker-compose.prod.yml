x-backend-common: &backend-common
  restart: unless-stopped
  env_file:
    - ./env/backend.prod.env
  environment:
    NODE_ENV: production
    PORT: 3000
    PRISMA_APPLY_MIGRATIONS: ${PRISMA_APPLY_MIGRATIONS:-false}
    ANALYTICS_QUEUE_URL: ${ANALYTICS_QUEUE_URL:-redis://redis:6379}
    QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis:6379}

x-frontend-common: &frontend-common
  restart: unless-stopped
  env_file:
    - ./env/frontend.prod.env

x-storefront-common: &storefront-common
  restart: unless-stopped
  env_file:
    - ./env/storefront.prod.env
  environment:
    NODE_ENV: production
    PORT: 3000
    NEXT_PUBLIC_STOREFRONT_API_URL: ${NEXT_PUBLIC_STOREFRONT_API_URL:-/api/storefront}
    STOREFRONT_API_URL: ${STOREFRONT_API_URL:-http://backend:3000/api/storefront}
    NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-/api}
    AUTH_API_URL: ${AUTH_API_URL:-http://backend:3000/api}
    NEXT_PUBLIC_ANALYTICS_API_URL: ${NEXT_PUBLIC_ANALYTICS_API_URL:-/api/analytics}
    ANALYTICS_API_URL: ${ANALYTICS_API_URL:-http://backend:3000/api/analytics}
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://midominio.com}
    NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-/media}
    NEXT_PUBLIC_MEDIA_PROVIDER: ${NEXT_PUBLIC_MEDIA_PROVIDER:-local}

services:
  frontend:
    <<: *frontend-common
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      # Override VITE_CLIENT_SLUG cuando necesites construir una variante específica (e.g. urucortinas)
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Sistema Administrativo}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_PREFIX_PATH: ${VITE_APP_PREFIX_PATH:-/admin}
        VITE_CLIENT_SLUG: ${VITE_CLIENT_SLUG:-core}
        VITE_STATE_SIGNATURE_KEY: ${VITE_STATE_SIGNATURE_KEY:-__set_prod_state_signature_key__}
        VITE_RECAPTCHA_ENABLED: ${VITE_RECAPTCHA_ENABLED:-false}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
        VITE_PARAMETRIC_IMPORT_TIMEOUT_MS: ${VITE_PARAMETRIC_IMPORT_TIMEOUT_MS:-120000}
    expose:
      - "80"
    environment:
      SERVER_NAME: ${APP_DOMAIN_PROD:-midominio.com}
    networks:
      - app-network
  backend:
    <<: *backend-common
    build:
      context: ../backend
      dockerfile: Dockerfile
      # Override CLIENT_SLUG para apuntar a una variante específica durante la build (e.g. urucortinas)
      args:
        CLIENT_SLUG: ${CLIENT_SLUG:-core}
    expose:
      - "3000"
    depends_on:
      - redis
    networks:
      - app-network
  analytics-worker:
    <<: *backend-common
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        CLIENT_SLUG: ${CLIENT_SLUG:-core}
    command: node dist/src/analytics/analytics.worker.js
    environment:
      NODE_ENV: production
      ANALYTICS_QUEUE_WORKER: "true"
      ANALYTICS_QUEUE_URL: ${ANALYTICS_QUEUE_URL:-redis://redis:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis:6379}
      PORT: 3000
    depends_on:
      - redis
      - backend
    networks:
      - app-network
  analytics-health-monitor:
    <<: *backend-common
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        CLIENT_SLUG: ${CLIENT_SLUG:-core}
    command: npm run analytics:health:monitor -- --interval-minutes ${ANALYTICS_HEALTH_INTERVAL_MINUTES:-15} --base-url ${ANALYTICS_HEALTH_BASE_URL:-http://backend:3000} --queue-name ${ANALYTICS_QUEUE_NAME:-analytics-pipeline}
    environment:
      NODE_ENV: production
      ANALYTICS_QUEUE_WORKER: "false"
      ANALYTICS_QUEUE_URL: ${ANALYTICS_QUEUE_URL:-redis://redis:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis:6379}
      ANALYTICS_HEALTH_BASE_URL: ${ANALYTICS_HEALTH_BASE_URL:-http://backend:3000}
      ANALYTICS_HEALTH_INTERVAL_MINUTES: ${ANALYTICS_HEALTH_INTERVAL_MINUTES:-15}
      ANALYTICS_HEALTH_SUMMARY_INTERVAL_MINUTES: ${ANALYTICS_HEALTH_SUMMARY_INTERVAL_MINUTES:-60}
      ANALYTICS_HEALTH_DIGEST_WINDOW_HOURS: ${ANALYTICS_HEALTH_DIGEST_WINDOW_HOURS:-24}
      ANALYTICS_HEALTH_DIGEST_LIMIT: ${ANALYTICS_HEALTH_DIGEST_LIMIT:-20}
      ANALYTICS_HEALTH_DIGEST_COOLDOWN_HOURS: ${ANALYTICS_HEALTH_DIGEST_COOLDOWN_HOURS:-24}
      ANALYTICS_HEALTH_SLACK_WEBHOOK_URL: ${ANALYTICS_HEALTH_SLACK_WEBHOOK_URL:-}
      ANALYTICS_HEALTH_ALERT_COOLDOWN_MINUTES: ${ANALYTICS_HEALTH_ALERT_COOLDOWN_MINUTES:-30}
      ANALYTICS_HEALTH_WAITING_WARNING_THRESHOLD: ${ANALYTICS_HEALTH_WAITING_WARNING_THRESHOLD:-10}
      ANALYTICS_HEALTH_WAITING_CRITICAL_THRESHOLD: ${ANALYTICS_HEALTH_WAITING_CRITICAL_THRESHOLD:-50}
      ANALYTICS_HEALTH_FAILED_CRITICAL_THRESHOLD: ${ANALYTICS_HEALTH_FAILED_CRITICAL_THRESHOLD:-5}
      ANALYTICS_HEALTH_MAX_SYNC_LAG_HOURS: ${ANALYTICS_HEALTH_MAX_SYNC_LAG_HOURS:-36}
      ANALYTICS_HEALTH_MIN_EVENT_ROWS_24H: ${ANALYTICS_HEALTH_MIN_EVENT_ROWS_24H:-1}
      ANALYTICS_HEALTH_MAX_ATTRIBUTION_MISMATCH_PCT: ${ANALYTICS_HEALTH_MAX_ATTRIBUTION_MISMATCH_PCT:-20}
      ANALYTICS_DATA_TRUST_LOOKBACK_DAYS: ${ANALYTICS_DATA_TRUST_LOOKBACK_DAYS:-7}
      ANALYTICS_DATA_TRUST_SILENCE_WINDOW_HOURS: ${ANALYTICS_DATA_TRUST_SILENCE_WINDOW_HOURS:-24}
      ANALYTICS_DATA_TRUST_MIN_CONVERSION_COUNT: ${ANALYTICS_DATA_TRUST_MIN_CONVERSION_COUNT:-1}
      ANALYTICS_DATA_TRUST_ZERO_CONVERSION_CRITICAL_TRAFFIC: ${ANALYTICS_DATA_TRUST_ZERO_CONVERSION_CRITICAL_TRAFFIC:-100}
      ANALYTICS_DATA_TRUST_ATTRIBUTION_MINIMUM_PERCENT: ${ANALYTICS_DATA_TRUST_ATTRIBUTION_MINIMUM_PERCENT:-70}
      ANALYTICS_DATA_TRUST_GA4_TOLERANCE_PERCENT: ${ANALYTICS_DATA_TRUST_GA4_TOLERANCE_PERCENT:-20}
      ANALYTICS_DATA_TRUST_TRAFFIC_DROP_THRESHOLD_PERCENT: ${ANALYTICS_DATA_TRUST_TRAFFIC_DROP_THRESHOLD_PERCENT:-40}
    restart: unless-stopped
    depends_on:
      - redis
      - backend
    networks:
      - app-network
  storefront:
    <<: *storefront-common
    build:
      context: ..
      dockerfile: ecommerce/Dockerfile
      args:
        CLIENT_SLUG: ${CLIENT_SLUG:-core}
        NEXT_PUBLIC_CLIENT_SLUG: ${NEXT_PUBLIC_CLIENT_SLUG:-core}
        NEXT_PUBLIC_STOREFRONT_API_URL: ${NEXT_PUBLIC_STOREFRONT_API_URL:-/api/storefront}
        STOREFRONT_API_URL: ${STOREFRONT_API_URL:-http://backend:3000/api/storefront}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-/api}
        AUTH_API_URL: ${AUTH_API_URL:-http://backend:3000/api}
        NEXT_PUBLIC_ANALYTICS_API_URL: ${NEXT_PUBLIC_ANALYTICS_API_URL:-/api/analytics}
        ANALYTICS_API_URL: ${ANALYTICS_API_URL:-http://backend:3000/api/analytics}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://midominio.com}
        NEXT_PUBLIC_STOREFRONT_HOME_PATH: ${NEXT_PUBLIC_STOREFRONT_HOME_PATH:-/}
        NEXT_PUBLIC_GOOGLE_BUTTON_ENABLED: ${NEXT_PUBLIC_GOOGLE_BUTTON_ENABLED:-true}
        NEXT_PUBLIC_ENABLE_STOREFRONT_MOCKS: ${NEXT_PUBLIC_ENABLE_STOREFRONT_MOCKS:-false}
        ENABLE_STOREFRONT_MOCKS: ${ENABLE_STOREFRONT_MOCKS:-false}
        NEXT_PUBLIC_ENABLE_STOREFRONT_FALLBACKS: ${NEXT_PUBLIC_ENABLE_STOREFRONT_FALLBACKS:-false}
        ENABLE_STOREFRONT_FALLBACKS: ${ENABLE_STOREFRONT_FALLBACKS:-false}
        NEXT_PUBLIC_ENABLE_SNAPSHOT_FALLBACKS: ${NEXT_PUBLIC_ENABLE_SNAPSHOT_FALLBACKS:-false}
        NEXT_PUBLIC_STOREFRONT_FAIL_FAST: ${NEXT_PUBLIC_STOREFRONT_FAIL_FAST:-false}
        STOREFRONT_FAIL_FAST: ${STOREFRONT_FAIL_FAST:-false}
        NEXT_PUBLIC_STORE_LOCALE: ${NEXT_PUBLIC_STORE_LOCALE:-es-UY}
        NEXT_PUBLIC_MP_PUBLIC_KEY: ${NEXT_PUBLIC_MP_PUBLIC_KEY:-}
        NEXT_PUBLIC_MP_COUNTRY: ${NEXT_PUBLIC_MP_COUNTRY:-UY}
        NEXT_PUBLIC_MP_SUCCESS_URL: ${NEXT_PUBLIC_MP_SUCCESS_URL:-/payment/success}
        NEXT_PUBLIC_MP_FAILURE_URL: ${NEXT_PUBLIC_MP_FAILURE_URL:-/payment/error}
        SNAPSHOT_ACCESS_TOKEN: ${SNAPSHOT_ACCESS_TOKEN:-}
      target: runtime
    expose:
      - "3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - managed-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  reverse-proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.reverse-proxy
    restart: unless-stopped
    environment:
      SERVER_NAME: ${APP_DOMAIN_PROD:-midominio.com}
      BACKEND_HOST: backend
      BACKEND_PORT: 3000
      FRONTEND_HOST: frontend
      FRONTEND_PORT: 80
      STOREFRONT_HOST: storefront
      STOREFRONT_PORT: 3000
    depends_on:
      - frontend
      - backend
      - storefront
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - reverse_proxy_certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://127.0.0.1/health || curl -f http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data_prod:
  reverse_proxy_certs:

networks:
  app-network:
    driver: bridge
