x-backend-common: &backend-common
  restart: unless-stopped
  env_file:
    - ./env/backend.prod.env
  environment:
    NODE_ENV: production
    PORT: 3000
    PRISMA_APPLY_MIGRATIONS: ${PRISMA_APPLY_MIGRATIONS:-false}

x-frontend-common: &frontend-common
  restart: unless-stopped
  env_file:
    - ./env/frontend.prod.env

services:
  frontend:
    <<: *frontend-common
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_CLIENT_SLUG: urucortinas
    ports:
      - "8080:80"
    environment:
      SERVER_NAME: ${APP_DOMAIN_PROD:-localhost}
      BACKEND_HOST: backend
      BACKEND_PORT: 3000
      VITE_CLIENT_SLUG: urucortinas

  backend:
    <<: *backend-common
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        CLIENT_SLUG: urucortinas
    ports:
      - "4000:3000"
    environment:
      CLIENT_SLUG: urucortinas

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - managed-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_prod:
