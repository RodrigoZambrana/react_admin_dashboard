services:
  ai-agent-service:
    profiles: ["ai"]
    container_name: ${APP_STACK_NAME:-admin-dashboard-dev}-ai-agent-service
    build:
      context: ../services
      dockerfile: ai-agent-service/Dockerfile
    env_file:
      - ./env/ai-agent.dev.env
      - path: ./env/.env.ai-agent.dev.local
        required: false
    environment:
      PORT: ${AI_AGENT_PORT:-4100}
      NODE_ENV: ${NODE_ENV:-development}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-local-ai-internal-token}
      AI_MODEL_PROVIDER: ${AI_MODEL_PROVIDER:-openai}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-gpt-4o-mini}
      AI_MEMORY_DRIVER: ${AI_MEMORY_DRIVER:-redis}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      - backend
      - redis
    ports:
      - "${AI_AGENT_PORT:-4100}:4100"

  channel-adapter:
    profiles: ["ai"]
    container_name: ${APP_STACK_NAME:-admin-dashboard-dev}-channel-adapter
    build:
      context: ../services
      dockerfile: channel-adapter/Dockerfile
    env_file:
      - ./env/channel-adapter.dev.env
      - path: ./env/.env.channel-adapter.dev.local
        required: false
    environment:
      PORT: ${CHANNEL_ADAPTER_PORT:-4200}
      NODE_ENV: ${NODE_ENV:-development}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-local-ai-internal-token}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
      WHATSAPP_QR_RUNTIME_DIR: /app/runtime/whatsapp-qr
    depends_on:
      - backend
      - ai-agent-service
      - redis
    ports:
      - "${CHANNEL_ADAPTER_PORT:-4200}:4200"
    volumes:
      - type: bind
        source: ${STACK_RUNTIME_ROOT:-../.docker/admin-dashboard-dev}/channel-adapter/whatsapp-qr
        target: /app/runtime/whatsapp-qr

  redis:
    profiles: ["ai", "ai-cache"]
    container_name: ${APP_STACK_NAME:-admin-dashboard-dev}-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
