name: local-test-env

x-backend-common: &backend-common
  restart: unless-stopped
  env_file:
    - ./.env.test
  environment:
    NODE_ENV: production
    PORT: 3000
    CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
    LOCAL_TEST_ENV: "true"
    PRISMA_APPLY_MIGRATIONS: "true"
    RUN_PRISMA_SEED_ON_BOOT: "true"
    SEED_BASELINE: "true"
    DB_HOST: db
    DB_PORT: 5432
    DB_USER: postgres
    DB_PASSWORD: postgres
    DB_NAME: react_admin_dashboard_test
    DATABASE_URL: postgresql://postgres:postgres@db:5432/react_admin_dashboard_test?schema=public
    REDIS_URL: redis://redis:6379
    QUEUE_REDIS_URL: redis://redis:6379
    AUTH_REDIS_URL: redis://redis:6379
    DEFAULT_ALLOWED_ORIGINS: http://localhost:8080
    ALLOWED_ORIGINS: http://localhost:8080
    NEXT_PUBLIC_SITE_URL: http://localhost:8080
    STOREFRONT_BASE_URL: http://localhost:8080
    MEDIA_ROOT: /app/media

x-admin-build-args: &admin-build-args
  VITE_APP_NAME: Sistema Administrativo (Test)
  VITE_API_URL: /api
  VITE_CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
  VITE_APP_PREFIX_PATH: /admin
  VITE_STATE_SIGNATURE_KEY: local-test-state-signature
  VITE_RECAPTCHA_ENABLED: false
  VITE_RECAPTCHA_SITE_KEY: ""
  VITE_PARAMETRIC_IMPORT_TIMEOUT_MS: 120000

x-storefront-build-args: &storefront-build-args
  CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
  NEXT_PUBLIC_CLIENT_SLUG: ${NEXT_PUBLIC_CLIENT_SLUG:-urucortinas}
  NEXT_PUBLIC_STOREFRONT_API_URL: http://localhost:8080/api/storefront
  STOREFRONT_API_URL: http://backend:3000/api/storefront
  NEXT_PUBLIC_SITE_URL: http://localhost:8080
  NEXT_PUBLIC_ANALYTICS_API_URL: http://localhost:8080/api/analytics
  NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:8080/media
  NEXT_PUBLIC_MEDIA_PROVIDER: local
  NEXT_PUBLIC_STOREFRONT_HOME_PATH: /
  NEXT_PUBLIC_GOOGLE_BUTTON_ENABLED: false
  NEXT_PUBLIC_ENABLE_STOREFRONT_MOCKS: false
  ENABLE_STOREFRONT_MOCKS: false
  NEXT_PUBLIC_ENABLE_STOREFRONT_FALLBACKS: false
  ENABLE_STOREFRONT_FALLBACKS: false
  NEXT_PUBLIC_ENABLE_SNAPSHOT_FALLBACKS: false
  NEXT_PUBLIC_STOREFRONT_FAIL_FAST: false
  STOREFRONT_FAIL_FAST: false
  NEXT_PUBLIC_STORE_LOCALE: es-UY
  NEXT_PUBLIC_MP_PUBLIC_KEY: ""
  NEXT_PUBLIC_MP_COUNTRY: UY
  NEXT_PUBLIC_MP_SUCCESS_URL: /payment/success
  NEXT_PUBLIC_MP_FAILURE_URL: /payment/error
  SNAPSHOT_ACCESS_TOKEN: ""

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: react_admin_dashboard_test
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    <<: *backend-common
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../urucortinas-storage/media:/app/media
      - ../urucortinas-storage/uploads:/app/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: *admin-build-args
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  storefront:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ecommerce/Dockerfile
      args: *storefront-build-args
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CLIENT_SLUG: ${CLIENT_SLUG:-urucortinas}
      NEXT_PUBLIC_CLIENT_SLUG: ${NEXT_PUBLIC_CLIENT_SLUG:-urucortinas}
      STOREFRONT_API_URL: http://backend:3000/api/storefront
      NEXT_PUBLIC_STOREFRONT_API_URL: http://localhost:8080/api/storefront
      AUTH_API_URL: http://backend:3000/api
      NEXT_PUBLIC_AUTH_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_ANALYTICS_API_URL: http://localhost:8080/api/analytics
      NEXT_PUBLIC_SITE_URL: http://localhost:8080
      NEXT_PUBLIC_STOREFRONT_HOME_PATH: /
      NEXT_PUBLIC_MEDIA_PROVIDER: local
      NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:8080/media
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      storefront:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data_test:
