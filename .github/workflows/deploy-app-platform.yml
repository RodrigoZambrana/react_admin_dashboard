name: Build, Push to GHCR & Deploy to DO App Platform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mi-app-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/mi-app-backend
  APP_NAME: mi-app

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set SHORT_SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.SHORT_SHA }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.SHORT_SHA }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Run DB migrations (Prisma)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          BACKEND_TAG: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.SHORT_SHA }}
        run: |
          echo "Running prisma migrate deploy against production DB..."
          docker pull "$BACKEND_TAG"
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            "$BACKEND_TAG" \
            sh -lc 'npx prisma generate && npx prisma migrate deploy'

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Render app spec
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.SHORT_SHA }}
        run: |
          export REPO_OWNER="${{ env.REPO_OWNER }}"
          envsubst < infra/app.yaml | sed "s/__TAG__/$IMAGE_TAG/g" > infra/app.rendered.yaml
          cat infra/app.rendered.yaml

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Validate spec
        run: doctl apps spec validate infra/app.rendered.yaml

      - name: Create or Update App
        env:
          APP_NAME: ${{ env.APP_NAME }}
        run: |
          set -e
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2=="'"${APP_NAME}"'"{print $1}')
          if [ -n "$APP_ID" ]; then
            echo "Updating App $APP_ID"
            doctl apps update "$APP_ID" --spec infra/app.rendered.yaml
          else
            echo "Creating App ${APP_NAME}"
            doctl apps create --spec infra/app.rendered.yaml
          fi
