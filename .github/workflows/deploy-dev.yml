name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      PRISMA_APPLY_MIGRATIONS: ${{ secrets.PRISMA_APPLY_MIGRATIONS }}
      POSTGRES_HOST_PORT: 0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (cached)
        if: ${{ hashFiles('frontend/package-lock.json', 'backend/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Set up Node.js (no cache)
        if: ${{ hashFiles('frontend/package-lock.json', 'backend/package-lock.json') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Test backend
        working-directory: backend
        run: npm run test -- --run

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Clean workspace artifacts
        run: |
          rm -rf frontend/node_modules backend/node_modules

      - name: Detect Prisma schema changes
        id: changes
        run: |
          set -euo pipefail
          BASE=${{ github.event.before }}
          if [ -z "$BASE" ]; then
            BASE=$(git rev-parse HEAD^ || echo '')
          fi
          if [ -z "$BASE" ]; then
            echo "prisma=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -q '^backend/prisma/'; then
            echo "prisma=true" >> "$GITHUB_OUTPUT"
          else
            echo "prisma=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar archivos de entorno
        env:
          BACKEND_ENV_FILE: ${{ secrets.ENV_FILE_BACKEND }}
          FRONTEND_ENV_FILE: ${{ secrets.ENV_FILE_FRONTEND }}
        run: |
          mkdir -p deploy/env
          if [ -n "$BACKEND_ENV_FILE" ]; then
            printf '%s' "$BACKEND_ENV_FILE" > deploy/env/backend.dev.env
          elif [ -f deploy/env/backend.dev.env ]; then
            echo "Reusing existing deploy/env/backend.dev.env"
          elif [ -f deploy/env/backend.dev.env.example ]; then
            cp deploy/env/backend.dev.env.example deploy/env/backend.dev.env
          else
            touch deploy/env/backend.dev.env
          fi
          if [ -n "$FRONTEND_ENV_FILE" ]; then
            printf '%s' "$FRONTEND_ENV_FILE" > deploy/env/frontend.dev.env
          elif [ -f deploy/env/frontend.dev.env ]; then
            echo "Reusing existing deploy/env/frontend.dev.env"
          elif [ -f deploy/env/frontend.dev.env.example ]; then
            cp deploy/env/frontend.dev.env.example deploy/env/frontend.dev.env
          else
            touch deploy/env/frontend.dev.env
          fi

      - name: Iniciar stack local de desarrollo
        run: |
          docker compose -f deploy/docker-compose.dev.yml down --remove-orphans || true
          docker compose -f deploy/docker-compose.dev.yml up -d --build

      - name: Aplicar migraciones de Prisma (si corresponde)
        if: ${{ env.PRISMA_APPLY_MIGRATIONS == 'true' && steps.changes.outputs.prisma == 'true' }}
        run: |
          docker compose -f deploy/docker-compose.dev.yml exec -T backend npx prisma migrate deploy

      - name: Apagar stack local
        if: always()
        run: |
          docker compose -f deploy/docker-compose.dev.yml down --remove-orphans -v
