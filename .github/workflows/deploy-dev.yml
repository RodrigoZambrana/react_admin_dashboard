name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Test backend
        working-directory: backend
        run: npm run test -- --run

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Clean workspace artifacts
        run: |
          rm -rf frontend/node_modules backend/node_modules

      - name: Detect Prisma schema changes
        id: changes
        run: |
          set -euo pipefail
          BASE=${{ github.event.before }}
          if [ -z "$BASE" ]; then
            BASE=$(git rev-parse HEAD^ || echo '')
          fi
          if [ -z "$BASE" ]; then
            echo "prisma=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -q '^backend/prisma/'; then
            echo "prisma=true" >> "$GITHUB_OUTPUT"
          else
            echo "prisma=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar archivos de entorno
        run: |
          mkdir -p deploy/env
          cat <<'EOB' > deploy/env/backend.dev.env
${{ secrets.ENV_FILE_BACKEND }}
EOB
          cat <<'EOH' > deploy/env/frontend.dev.env
${{ secrets.ENV_FILE_FRONTEND }}
EOH

      - name: Iniciar stack local de desarrollo
        run: |
          docker compose -f deploy/docker-compose.dev.yml down --remove-orphans || true
          docker compose -f deploy/docker-compose.dev.yml up -d --build

      - name: Aplicar migraciones de Prisma (si corresponde)
        if: ${{ secrets.PRISMA_APPLY_MIGRATIONS == 'true' && steps.changes.outputs.prisma == 'true' }}
        run: |
          docker compose -f deploy/docker-compose.dev.yml exec -T backend npx prisma migrate deploy

      - name: Health check local
        run: |
          curl -f --retry 10 --retry-delay 6 http://localhost:8080/api/health

      - name: Apagar stack local
        if: always()
        run: |
          docker compose -f deploy/docker-compose.dev.yml down --remove-orphans -v
