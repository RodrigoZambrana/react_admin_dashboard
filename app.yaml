name: react-admin-dashboard

services:
  - name: frontend
    environment_slug: docker
    github:
      repo: YOUR_GITHUB_USERNAME/react_admin_dashboard
      branch: deploy_digital_ocean_and_github
      deploy_on_push: true
    dockerfile_path: frontend/Dockerfile
    source_dir: frontend
    http_port: 80
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /
    envs:
      - key: VITE_APP_NAME
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
        value: React Admin Dashboard
      - key: VITE_API_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: VITE_API_URL
      - key: VITE_STATE_SIGNATURE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: VITE_STATE_SIGNATURE_KEY
      - key: VITE_RECAPTCHA_ENABLED
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
        value: "false"
      - key: VITE_RECAPTCHA_SITE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: VITE_RECAPTCHA_SITE_KEY

  - name: backend
    environment_slug: docker
    github:
      repo: YOUR_GITHUB_USERNAME/react_admin_dashboard
      branch: deploy_digital_ocean_and_github
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    http_port: 3000
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /api
        preserve_path_prefix: true
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        type: GENERAL
        value: production
      - key: PORT
        scope: RUN_TIME
        type: GENERAL
        value: "3000"
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        type: GENERAL
        value: https://YOUR_DOMAIN
      - key: PRISMA_APPLY_MIGRATIONS
        scope: RUN_TIME
        type: GENERAL
        value: "true"
      - key: RUN_PRISMA_SEED_ON_BOOT
        scope: RUN_TIME
        type: GENERAL
        value: "false"
      - key: ENABLE_DEMO_SEED
        scope: RUN_TIME
        type: GENERAL
        value: "false"
      - key: SESSION_TTL_HOURS
        scope: RUN_TIME
        type: GENERAL
        value: "168"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: DATABASE_URL
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: JWT_SECRET
      - key: COOKIE_SECRET
        scope: RUN_TIME
        type: SECRET
        value: COOKIE_SECRET
      - key: DEFAULT_USER_TEMP_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: DEFAULT_USER_TEMP_PASSWORD
      - key: SEED_SUPERADMIN_EMAIL
        scope: RUN_TIME
        type: SECRET
        value: SEED_SUPERADMIN_EMAIL
      - key: SEED_SUPERADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: SEED_SUPERADMIN_PASSWORD
      - key: SEED_SUPERADMIN_NAME
        scope: RUN_TIME
        type: SECRET
        value: SEED_SUPERADMIN_NAME
      - key: SEED_SUPERADMIN_FIRST_NAME
        scope: RUN_TIME
        type: SECRET
        value: SEED_SUPERADMIN_FIRST_NAME
      - key: SEED_SUPERADMIN_LAST_NAME
        scope: RUN_TIME
        type: SECRET
        value: SEED_SUPERADMIN_LAST_NAME
      - key: SEED_USER_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: SEED_USER_PASSWORD
      - key: RECAPTCHA_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: RECAPTCHA_SECRET_KEY
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
        value: SENTRY_DSN
